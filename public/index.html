<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#152028" />
    <meta name="description" content="Ali Saad — Full-stack developer and DevOps engineer. Scalable web apps, cloud infrastructure, and production delivery." />
    <title>Ali Saad — Full-Stack Developer & DevOps Engineer</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-preference') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light'
          );
          document.documentElement.setAttribute(
            'data-theme-preference',
            stored
          );
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
